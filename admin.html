<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PGHACKS1 — Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080808;--bg2:#111113;--bg3:#1a1a1e;--bg4:#222228;
  --border:#2a2a32;--border2:#333340;
  --gold:#f0c040;--gold2:#ffd700;--gold3:#a07820;--golddim:rgba(240,192,64,.12);
  --text:#e0e0e0;--text2:#888;--text3:#555;
  --red:#e05555;--reddim:rgba(224,85,85,.15);
  --green:#50c878;--greendim:rgba(80,200,120,.15);
  --blue:#5090e0;--bluedim:rgba(80,144,224,.15);
  --radius:10px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;}

/* ── LOGIN ─────────────────────────── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% 30%,#1c1200 0%,#080808 65%);
}
.login-box{width:min(360px,94vw);text-align:center;padding:36px 28px;}
.login-crown{font-size:40px;margin-bottom:12px;}
.login-box h1{color:var(--gold);font-size:20px;letter-spacing:3px;margin-bottom:4px;}
.login-box p{color:var(--text2);font-size:12px;margin-bottom:28px;}
.login-input{
  width:100%;padding:13px 16px;
  background:var(--bg2);border:1px solid var(--border2);
  color:var(--text);font-size:15px;border-radius:var(--radius);
  outline:none;margin-bottom:12px;letter-spacing:1px;
}
.login-input:focus{border-color:var(--gold3);}
.btn-login{
  width:100%;padding:14px;border:none;cursor:pointer;
  background:var(--gold);color:#000;font-weight:800;
  font-size:14px;border-radius:var(--radius);letter-spacing:2px;
  transition:.2s;
}
.btn-login:active{background:var(--gold2);transform:scale(.98);}
.login-err{color:var(--red);font-size:12px;min-height:20px;margin-top:10px;}
.login-info{margin-top:24px;color:var(--gold);font-size:11px;line-height:2;opacity:.7;}

/* ── APP SHELL ─────────────────────── */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden;}

/* Topbar */
.topbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-logo{color:var(--gold);font-size:14px;font-weight:800;letter-spacing:2px;}
.topbar-sub{color:var(--text3);font-size:10px;margin-top:1px;}
.btn-logout{
  background:none;border:1px solid var(--border2);color:var(--text2);
  padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;
}
.btn-logout:active{border-color:var(--red);color:var(--red);}

/* Pages container */
.pages{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 70px;}

/* Bottom Nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;height:58px;z-index:100;
}
.nav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;
  color:var(--text3);font-size:10px;font-weight:600;letter-spacing:.5px;
  transition:.15s;
}
.nav-tab .nt-icon{font-size:20px;line-height:1;}
.nav-tab.active{color:var(--gold);}
.nav-tab.active .nt-icon{filter:drop-shadow(0 0 6px var(--gold));}

/* ── PAGES ─────────────────────────── */
.page{display:none;}
.page.active{display:block;}

/* Section title */
.sec-title{
  font-size:11px;font-weight:700;letter-spacing:2px;
  color:var(--text2);text-transform:uppercase;
  margin:4px 0 10px;padding-left:4px;
}

/* ── STAT GRID ─────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 10px;text-align:center;
}
.stat-card .sv{font-size:26px;font-weight:800;line-height:1;}
.stat-card .sl{font-size:9px;color:var(--text2);letter-spacing:.5px;margin-top:3px;text-transform:uppercase;}
.sv-gold{color:var(--gold);}
.sv-green{color:var(--green);}
.sv-red{color:var(--red);}
.sv-blue{color:var(--blue);}

/* ── KEY CARD ──────────────────────── */
.key-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
}
.key-card-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px 8px;border-bottom:1px solid var(--border);
}
.key-text{
  font-family:monospace;font-size:13px;color:var(--gold);
  letter-spacing:1px;word-break:break-all;flex:1;margin-right:8px;
}
.badge{
  display:inline-flex;align-items:center;
  padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;
  flex-shrink:0;
}
.badge-active{background:var(--greendim);color:var(--green);}
.badge-blocked{background:var(--reddim);color:var(--red);}
.badge-expired{background:rgba(100,100,100,.2);color:#666;}

.key-card-info{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
}
.ki{padding:8px 14px;border-right:1px solid var(--border);}
.ki:nth-child(even){border-right:none;}
.ki:nth-child(n+3){border-top:1px solid var(--border);}
.ki .ki-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.ki .ki-val{font-size:12px;color:var(--text);font-weight:500;}
.ki .ki-val.red{color:var(--red);}
.ki .ki-val.blue{color:var(--blue);}

.key-card-actions{
  display:flex;border-top:1px solid var(--border);
}
.kact-btn{
  flex:1;padding:10px 4px;border:none;cursor:pointer;
  font-size:11px;font-weight:700;letter-spacing:.5px;background:none;
  transition:.15s;
}
.kact-btn+.kact-btn{border-left:1px solid var(--border);}
.kact-edit{color:var(--text2);}
.kact-edit:active{background:var(--bg3);}
.kact-block{color:var(--red);}
.kact-block:active{background:var(--reddim);}
.kact-unblock{color:var(--green);}
.kact-unblock:active{background:var(--greendim);}
.kact-del{color:var(--red);opacity:.6;}
.kact-del:active{background:var(--reddim);}

/* ── TOOLBAR ───────────────────────── */
.toolbar{
  display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;
}
.toolbar input,.toolbar select{
  flex:1;min-width:0;padding:9px 12px;
  background:var(--bg2);border:1px solid var(--border2);
  color:var(--text);font-size:13px;border-radius:8px;outline:none;
}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold3);}
.btn-refresh{
  padding:9px 14px;background:var(--bg2);border:1px solid var(--border2);
  color:var(--text2);border-radius:8px;cursor:pointer;font-size:14px;
}
.btn-refresh:active{background:var(--bg3);}

/* Pagination */
.pag{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.pag-btn{
  padding:7px 13px;background:var(--bg2);border:1px solid var(--border);
  color:var(--text2);border-radius:7px;cursor:pointer;font-size:12px;
}
.pag-btn.active{border-color:var(--gold3);color:var(--gold);}
.pag-info{font-size:11px;color:var(--text2);}

/* ── GENERATE PAGE ─────────────────── */
.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-group{margin-bottom:12px;}
.form-group:last-child{margin-bottom:0;}
.form-group label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.form-group input,.form-group select{
  width:100%;padding:11px 12px;
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);font-size:13px;border-radius:8px;outline:none;
}
.form-group input:focus{border-color:var(--gold3);}
.btn-generate{
  width:100%;padding:14px;background:var(--gold);color:#000;
  font-weight:800;font-size:14px;border:none;border-radius:var(--radius);
  cursor:pointer;letter-spacing:1px;margin-top:4px;
}
.btn-generate:active{background:var(--gold2);transform:scale(.98);}

.gen-output{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);margin-top:12px;overflow:hidden;
}
.gen-output-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--border);
}
.gen-output-label{color:var(--green);font-size:12px;font-weight:600;}
.btn-copy-all{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);padding:5px 12px;border-radius:6px;
  font-size:11px;cursor:pointer;
}
.btn-copy-all:active{color:var(--gold);}
.gen-keys-list{padding:10px 14px;max-height:220px;overflow-y:auto;}
.gen-key-line{
  font-family:monospace;color:var(--gold);font-size:13px;
  padding:4px 0;letter-spacing:1px;border-bottom:1px solid var(--border);
}
.gen-key-line:last-child{border-bottom:none;}

/* ── LOG CARD ──────────────────────── */
.log-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:8px;padding:12px 14px;
}
.log-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.log-key{font-family:monospace;font-size:12px;color:var(--gold);word-break:break-all;}
.log-result{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;}
.log-result.ok{background:var(--greendim);color:var(--green);}
.log-result.fail{background:var(--reddim);color:var(--red);}
.log-result.neutral{background:var(--bg3);color:var(--text2);}
.log-bottom{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);}

/* ── MODAL ─────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:none;align-items:flex-end;justify-content:center;z-index:1000;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--bg2);border:1px solid var(--gold3);
  border-radius:16px 16px 0 0;width:100%;max-height:88vh;
  overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,12px);
}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
.modal-header{padding:12px 20px 10px;border-bottom:1px solid var(--border);}
.modal-header h3{color:var(--gold);font-size:14px;letter-spacing:1px;}
.modal-body{padding:16px 20px;}
.modal-footer{
  display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border);
}
.btn-mf{
  flex:1;padding:12px;border-radius:8px;font-size:13px;
  font-weight:700;border:none;cursor:pointer;
}
.btn-mf-primary{background:var(--gold);color:#000;}
.btn-mf-primary:active{background:var(--gold2);}
.btn-mf-outline{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);}
.btn-mf-outline:active{color:var(--text);}
.btn-mf-danger{background:var(--reddim);color:var(--red);}

.dev-row{
  display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:11px;
}
.dev-row:last-child{border-bottom:none;}
.dev-id{font-family:monospace;color:var(--text2);flex:1;margin-right:8px;word-break:break-all;}
.dev-date{color:var(--text3);white-space:nowrap;}

/* ── TOAST ─────────────────────────── */
.toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg2);border:1px solid var(--gold3);color:var(--text);
  padding:10px 20px;border-radius:8px;font-size:13px;
  z-index:9999;opacity:0;transition:.25s;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:var(--red);}

/* ── EMPTY STATE ───────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{font-size:13px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-crown">♛</div>
    <h1>PGHACKS1</h1>
    <p>KEY MANAGEMENT SYSTEM</p>
    <input class="login-input" type="password" id="login-pass" placeholder="Admin Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">LOGIN →</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-info">
      🔑 DM TO BUY A KEY<br>
      📱 +92 3170025278<br>
      ✈️ Telegram: @PGHACKS7
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="topbar-logo">♛ PGHACKS1</div>
      <div class="topbar-sub">ADMIN PANEL</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">LOGOUT</button>
  </div>

  <!-- Pages -->
  <div class="pages" id="pages-container">

    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="stat-grid">
        <div class="stat-card"><div class="sv sv-gold" id="s-total">—</div><div class="sl">Total</div></div>
        <div class="stat-card"><div class="sv sv-green" id="s-active">—</div><div class="sl">Active</div></div>
        <div class="stat-card"><div class="sv sv-red" id="s-blocked">—</div><div class="sl">Blocked</div></div>
        <div class="stat-card"><div class="sv sv-blue" id="s-devices">—</div><div class="sl">Devices</div></div>
        <div class="stat-card"><div class="sv sv-gold" id="s-logins">—</div><div class="sl">Logins</div></div>
        <div class="stat-card"><div class="sv" id="s-expired">—</div><div class="sl">Expired</div></div>
      </div>
      <div class="sec-title">Recent Activity</div>
      <div id="recent-cards"></div>
    </div>

    <!-- KEYS -->
    <div class="page" id="page-keys">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="🔍 Search key..." oninput="searchKeys()">
        <select id="filter-status" onchange="searchKeys()">
          <option value="">All</option>
          <option value="active">Active</option>
          <option value="blocked">Blocked</option>
          <option value="expired">Expired</option>
        </select>
        <button class="btn-refresh" onclick="loadKeys()">↺</button>
      </div>
      <div id="keys-cards"></div>
      <div class="pag" id="keys-pagination"></div>
    </div>

    <!-- GENERATE -->
    <div class="page" id="page-generate">
      <div class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label>Prefix</label>
            <input type="text" id="gen-prefix" value="PGH" maxlength="6">
          </div>
          <div class="form-group">
            <label>Count</label>
            <input type="number" id="gen-count" value="1" min="1" max="100">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Expiry (optional)</label>
            <input type="datetime-local" id="gen-expiry">
          </div>
          <div class="form-group">
            <label>Max Devices</label>
            <input type="number" id="gen-devices" value="1" min="1">
          </div>
        </div>
        <div class="form-group">
          <label>Note (optional)</label>
          <input type="text" id="gen-note" placeholder="e.g. VIP, Reseller...">
        </div>
        <button class="btn-generate" onclick="generateKeys()">✨ GENERATE KEYS</button>
      </div>
      <div id="gen-output" style="display:none;"></div>
    </div>

    <!-- LOGS -->
    <div class="page" id="page-logs">
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button class="btn-refresh" onclick="loadLogs()" style="font-size:12px;padding:7px 14px;">↺ Refresh</button>
      </div>
      <div id="logs-cards"></div>
    </div>

  </div><!-- /pages -->

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-tab active" id="nav-dashboard" onclick="showPage('dashboard')">
      <div class="nt-icon">📊</div>
      <div>Dashboard</div>
    </div>
    <div class="nav-tab" id="nav-keys" onclick="showPage('keys')">
      <div class="nt-icon">🔑</div>
      <div>Keys</div>
    </div>
    <div class="nav-tab" id="nav-generate" onclick="showPage('generate')">
      <div class="nt-icon">✨</div>
      <div>Generate</div>
    </div>
    <div class="nav-tab" id="nav-logs" onclick="showPage('logs')">
      <div class="nt-icon">📋</div>
      <div>Logs</div>
    </div>
  </div>

</div><!-- /app -->

<!-- EDIT MODAL (bottom sheet) -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header"><h3>✏️ EDIT KEY</h3></div>
    <div class="modal-body">
      <div class="form-group"><label>Key</label><input type="text" id="edit-key-text" readonly style="color:var(--gold);font-family:monospace;font-size:12px;"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="edit-status">
            <option value="active">Active</option>
            <option value="blocked">Blocked</option>
            <option value="expired">Expired</option>
          </select>
        </div>
        <div class="form-group">
          <label>Max Devices</label>
          <input type="number" id="edit-max-devices" min="1" max="100">
        </div>
      </div>
      <div class="form-group"><label>Expiry Date</label><input type="datetime-local" id="edit-expiry"></div>
      <div class="form-group"><label>Note</label><input type="text" id="edit-note"></div>
      <div id="edit-devices-section" style="margin-top:4px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-mf btn-mf-danger" onclick="resetDevices()">🗑️ Devices</button>
      <button class="btn-mf btn-mf-outline" onclick="closeModal('edit-modal')">Cancel</button>
      <button class="btn-mf btn-mf-primary" onclick="saveEdit()">Save →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='';
let adminToken=localStorage.getItem('pgh_token')||'';
let currentPage=1;
let searchTimer;

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json','x-admin-token':adminToken}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  return r.json();
}

function toast(msg,error=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(error?' error':'');
  setTimeout(()=>t.className='toast',2500);
}

// LOGIN
async function doLogin(){
  const pass=document.getElementById('login-pass').value;
  if(!pass)return;
  const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})})
    .then(r=>r.json()).catch(()=>({success:false,message:'Cannot connect!'}));
  if(r.success){
    adminToken=r.token;localStorage.setItem('pgh_token',adminToken);
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    loadDashboard();
  }else{
    document.getElementById('login-err').textContent=r.message||'Login failed';
  }
}

function doLogout(){adminToken='';localStorage.removeItem('pgh_token');location.reload();}

(async()=>{
  if(adminToken){
    const r=await api('GET','/admin/stats').catch(()=>null);
    if(r&&r.success){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='flex';
      loadDashboard();
    }else{adminToken='';localStorage.removeItem('pgh_token');}
  }
})();

// NAV
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  document.getElementById('pages-container').scrollTop=0;
  if(name==='dashboard')loadDashboard();
  if(name==='keys')loadKeys();
  if(name==='logs')loadLogs();
}

// DASHBOARD
async function loadDashboard(){
  const r=await api('GET','/admin/stats');
  if(!r.success)return;
  const d=r.data;
  document.getElementById('s-total').textContent=d.total;
  document.getElementById('s-active').textContent=d.active;
  document.getElementById('s-blocked').textContent=d.blocked;
  document.getElementById('s-expired').textContent=d.expired;
  document.getElementById('s-devices').textContent=d.devices;
  document.getElementById('s-logins').textContent=d.logins;
  const lr=await api('GET','/admin/logs');
  if(lr.success){
    const c=document.getElementById('recent-cards');
    const data=lr.data.slice(0,15);
    if(!data.length){c.innerHTML=emptyState('No activity yet');return;}
    c.innerHTML=data.map(l=>logCard(l)).join('');
  }
}

// KEYS
async function loadKeys(page=1){
  currentPage=page;
  const search=document.getElementById('search-input').value;
  const status=document.getElementById('filter-status').value;
  const params=new URLSearchParams({page,...(search?{search}:{}),...(status?{status}:{})});
  const r=await api('GET','/admin/keys?'+params);
  if(!r.success)return;
  const c=document.getElementById('keys-cards');
  if(!r.data.length){c.innerHTML=emptyState('No keys found');document.getElementById('keys-pagination').innerHTML='';return;}
  c.innerHTML=r.data.map(k=>keyCard(k)).join('');
  const pag=document.getElementById('keys-pagination');
  if(r.pages>1){
    let h=`<span class="pag-info">${r.total} keys</span>`;
    if(r.page>1)h+=`<button class="pag-btn" onclick="loadKeys(${r.page-1})">‹</button>`;
    for(let p=Math.max(1,r.page-1);p<=Math.min(r.pages,r.page+1);p++)
      h+=`<button class="pag-btn${p===r.page?' active':''}" onclick="loadKeys(${p})">${p}</button>`;
    if(r.page<r.pages)h+=`<button class="pag-btn" onclick="loadKeys(${r.page+1})">›</button>`;
    pag.innerHTML=h;
  }else{pag.innerHTML=`<span class="pag-info">${r.total} keys</span>`;}
}

function keyCard(k){
  const badgeCls='badge-'+k.status;
  const expColor=isExpiredDate(k.expiry_date)?'red':'';
  const exp=k.expiry_date?`<span class="${expColor}">${fmtDateShort(k.expiry_date)}</span>`:`<span style="color:var(--text3)">Never</span>`;
  const blockBtn=k.status==='blocked'
    ?`<button class="kact-btn kact-unblock" onclick="unblockKey('${esc(k.key_text)}')">✅ Unblock</button>`
    :`<button class="kact-btn kact-block" onclick="blockKey('${esc(k.key_text)}')">🚫 Block</button>`;
  return `<div class="key-card">
    <div class="key-card-top">
      <div class="key-text">${esc(k.key_text)}</div>
      <span class="badge ${badgeCls}">${k.status.toUpperCase()}</span>
    </div>
    <div class="key-card-info">
      <div class="ki"><div class="ki-label">Expiry</div><div class="ki-val ${expColor}">${exp}</div></div>
      <div class="ki"><div class="ki-label">Devices</div><div class="ki-val blue">${k.device_count} / ${k.max_devices}</div></div>
      <div class="ki"><div class="ki-label">Note</div><div class="ki-val">${esc(k.note||'—')}</div></div>
      <div class="ki"><div class="ki-label">Created</div><div class="ki-val">${fmtDateShort(k.created_at)}</div></div>
    </div>
    <div class="key-card-actions">
      <button class="kact-btn kact-edit" onclick="openEdit('${esc(k.key_text)}')">✏️ Edit</button>
      ${blockBtn}
      <button class="kact-btn kact-del" onclick="deleteKey('${esc(k.key_text)}')">🗑️ Del</button>
    </div>
  </div>`;
}

function searchKeys(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadKeys(1),350);}

// GENERATE
async function generateKeys(){
  const prefix=document.getElementById('gen-prefix').value||'PGH';
  const count=parseInt(document.getElementById('gen-count').value)||1;
  const expiryRaw=document.getElementById('gen-expiry').value;
  const devices=parseInt(document.getElementById('gen-devices').value)||1;
  const note=document.getElementById('gen-note').value;
  let expiry_date=null;
  if(expiryRaw){const d=new Date(expiryRaw);expiry_date=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':00';}
  const r=await api('POST','/admin/keys/generate',{prefix,count,expiry_date,max_devices:devices,note});
  if(!r.success){toast('Generate failed!',true);return;}
  const out=document.getElementById('gen-output');
  out.style.display='block';
  out.innerHTML=`<div class="gen-output">
    <div class="gen-output-header">
      <span class="gen-output-label">✅ ${r.keys.length} key(s) generated</span>
      <button class="btn-copy-all" onclick="copyAllKeys()">COPY ALL</button>
    </div>
    <div class="gen-keys-list" id="keys-output-box">
      ${r.keys.map(k=>`<div class="gen-key-line">${k}</div>`).join('')}
    </div>
  </div>`;
  toast(`${r.keys.length} keys generated!`);
}

function copyAllKeys(){
  const keys=[...document.querySelectorAll('#keys-output-box .gen-key-line')].map(el=>el.textContent).join('\n');
  navigator.clipboard.writeText(keys).then(()=>toast('All keys copied!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=keys;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);toast('Copied!');
  });
}

// BLOCK / UNBLOCK / DELETE
async function blockKey(key){const r=await api('POST',`/admin/keys/${encodeURIComponent(key)}/block`);if(r.success){toast('Key blocked');loadKeys(currentPage);}}
async function unblockKey(key){const r=await api('POST',`/admin/keys/${encodeURIComponent(key)}/unblock`);if(r.success){toast('Key unblocked');loadKeys(currentPage);}}
async function deleteKey(key){
  if(!confirm(`Delete: ${key}?`))return;
  const r=await api('DELETE',`/admin/keys/${encodeURIComponent(key)}`);
  if(r.success){toast('Key deleted');loadKeys(currentPage);}
}

// EDIT MODAL
let editingKey='';
async function openEdit(key){
  editingKey=key;
  const r=await api('GET',`/admin/keys/${encodeURIComponent(key)}`);
  if(!r.success){toast('Key not found',true);return;}
  const k=r.data;
  document.getElementById('edit-key-text').value=k.key_text;
  document.getElementById('edit-status').value=k.status;
  document.getElementById('edit-max-devices').value=k.max_devices;
  document.getElementById('edit-note').value=k.note||'';
  if(k.expiry_date){const d=new Date(k.expiry_date);document.getElementById('edit-expiry').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
  else document.getElementById('edit-expiry').value='';
  const devSec=document.getElementById('edit-devices-section');
  if(r.devices&&r.devices.length){
    devSec.innerHTML=`<div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Devices (${r.devices.length})</div>`
      +r.devices.map(d=>`<div class="dev-row"><span class="dev-id">${esc(shortDevice(d.device_id))}</span><span class="dev-date">${fmtDateShort(d.last_seen)}</span></div>`).join('');
  }else{devSec.innerHTML='<div style="font-size:12px;color:var(--text3);padding:8px 0;">No devices registered.</div>';}
  document.getElementById('edit-modal').classList.add('show');
}

async function saveEdit(){
  const expiryRaw=document.getElementById('edit-expiry').value;
  let expiry_date=null;
  if(expiryRaw){const d=new Date(expiryRaw);expiry_date=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':00';}
  const r=await api('PUT',`/admin/keys/${encodeURIComponent(editingKey)}`,{status:document.getElementById('edit-status').value,max_devices:parseInt(document.getElementById('edit-max-devices').value),expiry_date,note:document.getElementById('edit-note').value});
  if(r.success){toast('Key updated!');closeModal('edit-modal');loadKeys(currentPage);}else{toast('Update failed!',true);}
}

async function resetDevices(){
  if(!confirm('Reset all devices for this key?'))return;
  const r=await api('DELETE',`/admin/keys/${encodeURIComponent(editingKey)}/devices`);
  if(r.success){toast('Devices reset!');openEdit(editingKey);}
}

function closeModal(id){document.getElementById(id).classList.remove('show');}

// LOGS
async function loadLogs(){
  const r=await api('GET','/admin/logs');
  if(!r.success)return;
  const c=document.getElementById('logs-cards');
  if(!r.data.length){c.innerHTML=emptyState('No logs yet');return;}
  c.innerHTML=r.data.map(l=>logCard(l)).join('');
}

function logCard(l){
  const isOk=l.result==='success';
  const isBad=l.result.match(/block|delet|expired|fail|not_found|max/);
  const cls=isOk?'ok':isBad?'fail':'neutral';
  return `<div class="log-card">
    <div class="log-top">
      <div class="log-key">${esc(l.key_text||'—')}</div>
      <span class="log-result ${cls}">${esc(l.result)}</span>
    </div>
    <div class="log-bottom">
      <span>${esc(l.action)}</span>
      <span>${esc(shortDevice(l.device_id))}</span>
      <span>${fmtDateShort(l.created_at)}</span>
    </div>
  </div>`;
}

// UTILS
function emptyState(msg){return `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">${msg}</div></div>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pad(n){return String(n).padStart(2,'0');}
function fmtDateShort(s){if(!s)return '—';const d=new Date(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function isExpiredDate(s){return s&&new Date(s)<new Date();}
function shortDevice(s){return s?(s.length>22?s.slice(0,10)+'…'+s.slice(-6):s):'—';}

document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show');});
});
</script>
</body>
